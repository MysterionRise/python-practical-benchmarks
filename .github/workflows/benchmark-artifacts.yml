name: Benchmark Artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  quick-benchmark-artifacts:
    name: Generate quick benchmark evidence
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-optional.txt

    - name: Generate JSON and Markdown evidence
      run: |
        mkdir -p reports/output
        python run_all_tests.py --all --quick --format json --output reports/output/ci-quick.json
        python scripts/render_report.py reports/output/ci-quick.json --output reports/output/ci-quick.md

    - name: Upload benchmark evidence
      uses: actions/upload-artifact@v4
      with:
        name: scheduled-benchmark-evidence
        path: |
          reports/output/ci-quick.json
          reports/output/ci-quick.md
        retention-days: 90
