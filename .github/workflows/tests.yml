name: Benchmark Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-benchmarks:
    name: Test benchmarks on Python ${{ matrix.python-version }}
    # Pinned: CPython 3.9 builds are only published for Ubuntu 22.04 and 24.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install optional dependencies
      run: |
        # One package at a time, so one failure doesn't block the rest; missing packages become skipped cases.
        # orjson is wheel-only: free-threaded builds have no wheel and its Rust source build is slow.
        grep -vE '^[[:space:]]*(#|$)' requirements-optional.txt | while read -r req; do
          pip install --only-binary orjson "$req" || echo "::warning::Could not install $req; its benchmark cases will be skipped"
        done

    - name: Run unit tests
      run: |
        python -m pytest tests/ -q

    - name: Run all benchmarks (quick mode)
      run: |
        mkdir -p reports/output
        python run_all_tests.py --all --quick --output reports/output/ci-quick.json

    - name: Render benchmark report
      if: always() && matrix.python-version == '3.11'
      run: |
        python scripts/render_report.py reports/output/ci-quick.json --output reports/output/ci-quick.md

    - name: Upload benchmark artifact
      if: always() && matrix.python-version == '3.11'
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-evidence-python-3.11
        path: |
          reports/output/ci-quick.json
          reports/output/ci-quick.md
        retention-days: 30

  test-with-coverage:
    name: Test with coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-optional.txt || true

    - name: Run pytest with coverage
      run: |
        pytest tests/ -v --cov --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true

  test-with-optional-deps:
    name: Test with all optional dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install all dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-optional.txt

    - name: Run serialization benchmarks with all formats
      run: |
        python serialization_formats_perf_test.py

    - name: Run object creation with attrs
      run: |
        python object_creation_patterns_perf_test.py

    - name: Run JSON benchmarks with orjson
      run: |
        python json_perf_test.py

  test-minimal-deps:
    name: Test with minimal dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install minimal dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy pytest pytest-cov

    - name: Run core benchmarks (no optional deps)
      run: |
        python run_all_tests.py --all --quick
