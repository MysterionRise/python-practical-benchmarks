version: 2
updates:
  # Python dependencies
  # Reviewers come from .github/CODEOWNERS; the `reviewers` option was removed from Dependabot.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Ranges like "pandas>=2.0.0,<4.0.0" only change when a new release falls outside them,
    # instead of raising the lower bound on every release.
    versioning-strategy: "widen"
    cooldown:
      default-days: 7
      semver-major-days: 14
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
